<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Login — Get Gorgeous</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  body { background: var(--surface-sunken, #F7F1EE); margin: 0; }
  .login-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: min(340px, 100%);
    background: var(--surface, #fff);
    border-radius: 16px;
    padding: 36px 24px 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent, #A6314F); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display, serif);
    font-weight: 700; font-size: 1.6rem;
    margin: 0 auto 20px;
  }
  .login-title { font-family: var(--font-display, serif); font-size: 1.5rem; margin: 0 0 4px; }
  .login-sub   { font-size: 0.85rem; color: var(--ink-soft, #888); margin: 0 0 28px; }
  .pin-input {
    width: 100%; box-sizing: border-box;
    font-size: 2.2rem; letter-spacing: 0.8em; text-align: center;
    border: 2px solid var(--line, #EBE1DD); border-radius: 10px;
    padding: 12px 16px;
    background: var(--surface-sunken, #F7F1EE);
    color: var(--ink, #1A1A1A);
    outline: none; transition: border-color 0.15s;
    font-family: monospace;
  }
  .pin-input:focus { border-color: var(--accent, #A6314F); }
  .login-btn {
    width: 100%; margin-top: 14px; padding: 14px;
    background: var(--accent, #A6314F); color: #fff;
    border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    font-family: var(--font-body, sans-serif);
    transition: opacity 0.15s;
  }
  .login-btn:disabled { opacity: 0.55; cursor: default; }
  .error-msg { margin-top: 14px; color: var(--danger, #A6314F); font-size: 0.85rem; min-height: 18px; }
</style>
</head>
<body>
<script src="assets/js/app-config.js"></script>
<script src="assets/js/session.js"></script>
<script>
  // Already logged in → home
  if (getCurrentUser()) window.location.replace('./home.html');
</script>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-circle">GG</div>
    <h1 class="login-title">Get Gorgeous</h1>
    <p class="login-sub">Apna 4-digit PIN daalo</p>

    <input type="password" id="pinInput" class="pin-input"
      inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">

    <button id="loginBtn" class="login-btn" onclick="doLogin()">Login →</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script>
  const pinInput = document.getElementById('pinInput');
  const loginBtn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  pinInput.focus();

  pinInput.addEventListener('input', () => {
    errorMsg.textContent = '';
    if (pinInput.value.length === 4) doLogin();
  });
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const pin = pinInput.value.trim();
    if (pin.length < 4) { errorMsg.textContent = '4 digit PIN daalo.'; return; }
    if (loginBtn.disabled) return;

    loginBtn.disabled = true;
    loginBtn.textContent = '…';
    errorMsg.textContent = '';

    try {
      await Session.loginWithPin(pin);
      window.location.replace('./home.html');
    } catch (err) {
      errorMsg.textContent =
        err.message === 'Wrong PIN' ? 'Galat PIN — dobara try karo.' :
        err.message === 'Account inactive hai — owner se contact karo.' ? err.message :
        'Server se connect nahi hua. Internet check karo.';
      pinInput.value = '';
      pinInput.focus();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login →';
    }
  }
</script>
</body>
</html>
