<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marketing — Get Gorgeous</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/marketing.css">
</head>
<body>
  <div class="app-shell">
    <div class="top-nav-bar" id="topNavBar"></div>
    <main class="main">

      <div class="split-layout" id="marketingLayout">
        <div>
          <div class="card mb-16">
            <h3 class="mb-16">Send WhatsApp Messages</h3>

            <label>1. Customers <span id="mktSelCount" class="text-soft" style="font-weight:400;">(0 selected)</span></label>
            <input id="mktSearch" placeholder="Name ya number se search karo..." oninput="renderCustomerList()">
            <div class="flex gap-8 mkt-pickbar">
              <button type="button" class="btn btn-ghost" onclick="selectAllVisible()">Select all</button>
              <button type="button" class="btn btn-ghost" onclick="clearSelection()">Clear</button>
            </div>
            <div class="mkt-picker" id="mktCustomerList"></div>

            <label class="mt-16">2. Message mein kya kya bhejna hai</label>
            <div class="mkt-blocks" id="mktBlocks"></div>
            <div id="mktCustomWrap" style="display:none;" class="field">
              <label>Custom line (&#123;name&#125; likhoge to customer ka naam aa jayega)</label>
              <textarea id="mktCustomText" rows="2" oninput="onCustomInput()"></textarea>
            </div>

            <label class="mt-16">3. Preview</label>
            <select id="mktPreviewCustomer" onchange="renderPreview()"></select>
            <div id="mktPreview" class="mkt-preview"></div>
            <div id="mktSummary" class="text-soft mkt-summary"></div>

            <button id="mktSendBtn" class="btn btn-primary" style="width:100%;" onclick="queueMarketingMessages()">📨 Add to WhatsApp Queue</button>
            <div id="mktQueuedNote" class="text-soft mt-16" style="display:none; font-size:0.85rem;"></div>
          </div>
        </div>

        <div>
          <div class="card mb-16" id="mktQueueCard">
            <h3 class="mb-16">Marketing Queue</h3>
            <div class="flex gap-8 mb-16">
              <button class="btn btn-secondary" id="mktTabBtn-pending" onclick="switchMktTab('pending')">Pending</button>
              <button class="btn btn-ghost" id="mktTabBtn-sent" onclick="switchMktTab('sent')">Sent</button>
            </div>
            <div id="mktTab-pending"><div id="mktPendingList"></div></div>
            <div id="mktTab-sent" style="display:none;"><div id="mktSentList"></div></div>
          </div>

          <div class="card mb-16">
            <h3 class="mb-16">Social Engagement Links</h3>
            <div class="field"><label>Google Review Link</label><input id="setReview" placeholder="https://g.page/r/..."></div>
            <div class="field"><label>Instagram Handle / Link</label><input id="setInstagram" placeholder="https://instagram.com/yoursalon"></div>
            <div class="field"><label>Facebook Page Link</label><input id="setFacebook" placeholder="https://facebook.com/yoursalon"></div>
            <div class="field"><label>Google Maps Location Link</label><input id="setMaps" placeholder="https://maps.app.goo.gl/..."></div>
            <button class="btn btn-secondary" onclick="saveSocialLinks()">Save Links</button>
          </div>

          <div class="card">
            <h3 class="mb-16">Quick Share Buttons</h3>
            <div class="flex gap-8" style="flex-wrap:wrap;">
              <a class="btn btn-secondary" id="btnReview" href="#" target="_blank">⭐ Google Review</a>
              <a class="btn btn-secondary" id="btnInsta" href="#" target="_blank">📸 Instagram</a>
              <a class="btn btn-secondary" id="btnFb" href="#" target="_blank">👍 Facebook</a>
              <a class="btn btn-secondary" id="btnMaps" href="#" target="_blank">📍 Location</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/db.js"></script>
  <script src="assets/js/session.js"></script>
  <script>requireLogin(); enforceAccess('marketing'); applyRoleUI();</script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/app-config.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/reminders.js"></script>
  <script src="assets/js/marketing.js"></script>
</body>
</html>
