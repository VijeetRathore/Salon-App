<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventory — Get Gorgeous</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/inventory.css">
</head>
<body>
  <div class="app-shell">
    <div class="top-nav-bar" id="topNavBar"></div>
    <main class="main">

      <!-- Tabs: Purchase Entry | Services (Products tab removed) -->
      <div class="flex gap-8 mb-16">
        <button class="btn btn-secondary" data-tab="purchase" onclick="switchTab('purchase')" id="tabBtn-purchase">Purchase Entry</button>
        <button class="btn btn-ghost"     data-tab="services" onclick="switchTab('services')" id="tabBtn-services">Services</button>
      </div>

      <!-- Purchase Entry -->
      <div id="tab-purchase">
        <div class="card" style="max-width: 640px;">
          <h3 class="mb-16">Record a Purchase</h3>
          <div class="grid grid-2">
            <div class="field"><label>Supplier</label><input id="purSupplier" type="text"></div>
            <div class="field"><label>Invoice No.</label><input id="purInvoice" type="text"></div>
          </div>

          <label>Products in this Invoice</label>
          <div id="purchaseRows"></div>
          <button type="button" class="btn btn-secondary mb-16" onclick="addPurchaseRow()">+ Add Product</button>

          <!-- Bill Upload — mandatory -->
          <div class="field">
            <label>
              Bill Photo <span style="color:var(--warn); font-size:0.8rem; font-weight:600;">* Required</span>
            </label>
            <div id="billUploadArea" style="
              border: 2px dashed var(--line); border-radius: 12px;
              padding: 20px; text-align: center; cursor: pointer;
              transition: border-color 0.2s;
            " onclick="document.getElementById('purBillInput').click()">
              <div id="billPreviewThumb" style="display:none; margin-bottom:10px;">
                <img id="billThumbImg" style="max-height:120px; border-radius:8px; max-width:100%;" src="" alt="Bill preview">
              </div>
              <div id="billUploadPrompt">
                <div style="font-size:1.6rem; margin-bottom:4px;">📷</div>
                <div style="font-size:0.9rem; color:var(--ink-soft);">Tap to take photo or upload bill</div>
              </div>
            </div>
            <input id="purBillInput" type="file" accept="image/*" capture="environment"
                   style="display:none;" onchange="handleBillUpload(this)">
            <div id="billStatusText" style="font-size:0.8rem; margin-top:6px; color:var(--ink-soft);"></div>
          </div>

          <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="recordPurchase()">
            Save Purchase &amp; Update Stock
          </button>
        </div>

        <h3 class="mt-16 mb-16">Recent Purchases</h3>
        <div class="card" style="padding:0;"><div id="purchaseList"></div></div>
      </div>

      <!-- Services -->
      <div id="tab-services" style="display:none;">
        <div class="flex mb-16" style="justify-content: space-between;">
          <h3>Services</h3>
          <button class="btn btn-primary" onclick="openServiceModal()">+ New Service</button>
        </div>
        <div class="card" style="padding:0;"><div id="serviceList"></div></div>
      </div>
    </main>
  </div>

  <!-- Bill Not Available dialog -->
  <dialog id="billMissingDialog" style="border:none; border-radius:20px; padding:0; width:min(360px,92vw);">
    <div class="card" style="border:none; box-shadow:none;">
      <h3 class="mb-16">Bill Photo Required</h3>
      <p style="color:var(--ink-soft); font-size:0.9rem; margin-bottom:20px;">
        Please upload a photo of the purchase bill. If you don't have it right now, you can proceed without it.
      </p>
      <div class="flex gap-12" style="flex-direction:column;">
        <button class="btn btn-primary" onclick="document.getElementById('billMissingDialog').close(); document.getElementById('purBillInput').click();">
          📷 Click Photo of Bill
        </button>
        <button class="btn btn-ghost" onclick="proceedWithoutBill()" style="color:var(--warn);">
          Bill Not Available — Continue Anyway
        </button>
      </div>
    </div>
  </dialog>

  <!-- Service Modal -->
  <dialog id="serviceModal" style="border:none; border-radius: 20px; padding: 0; width: min(560px, 92vw);">
    <form method="dialog" id="serviceForm" class="card" style="border:none; box-shadow:none;">
      <h2 class="mb-16">New Service</h2>
      <input type="hidden" id="svcId">
      <div class="grid grid-2">
        <div class="field"><label>Service Name *</label><input id="svcName" required></div>
        <div class="field"><label>Price (₹) *</label><input id="svcPrice" type="number" min="0" required></div>
      </div>
      <div class="field"><label>Duration (minutes)</label><input id="svcDuration" type="number" min="0"></div>
      <label>Product Consumption (optional)</label>
      <div id="svcConsumptionRows"></div>
      <button type="button" class="btn btn-secondary mb-16" onclick="addConsumptionRow()">+ Add Product Used</button>
      <div class="flex gap-12" style="justify-content: flex-end;">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('serviceModal').close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Service</button>
      </div>
    </form>
  </dialog>

  <script src="assets/js/db.js"></script>
  <script src="assets/js/device-id.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/app-config.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/reminders.js"></script>
  <script src="assets/js/inventory.js"></script>
</body>
</html>
