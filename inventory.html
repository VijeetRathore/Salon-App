<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventory — Get Gorgeous</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/inventory.css">
</head>
<body>
<div class="app-shell">
  <div class="top-nav-bar" id="topNavBar"></div>
  <main class="main">

    <!-- Tabs -->
    <div class="flex gap-8 mb-16">
      <button class="btn btn-secondary" id="tabBtn-products"  onclick="switchTab('products')">Products</button>
      <button class="btn btn-ghost"     id="tabBtn-purchase"  onclick="switchTab('purchase')">Purchase</button>
      <button class="btn btn-ghost"     id="tabBtn-services"  onclick="switchTab('services')">Services</button>
    </div>

    <!-- ========== PRODUCTS TAB ========== -->
    <div id="tab-products">
      <div class="flex mb-16" style="justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Products</h3>
        <button class="btn btn-primary" onclick="openProductModal()">+ New Product</button>
      </div>
      <div class="card" style="padding:0;"><div id="productList"></div></div>
    </div>

    <!-- ========== PURCHASE TAB ========== -->
    <div id="tab-purchase" style="display:none;">
      <div class="card" style="max-width:680px;">
        <h3 class="mb-16">Record a Purchase</h3>

        <div class="grid grid-2">
          <div class="field"><label>Supplier</label><input id="purSupplier" type="text" placeholder="Supplier name"></div>
          <div class="field"><label>Invoice No.</label><input id="purInvoice" type="text" placeholder="Invoice number"></div>
        </div>
        <div class="field">
          <label>Invoice Date</label>
          <input id="purDate" type="date">
        </div>

        <label style="font-weight:600; margin-bottom:8px; display:block;">Products in this Invoice</label>
        <div id="purchaseRows"></div>
        <button type="button" class="btn btn-secondary mb-16" onclick="addPurchaseRow()">+ Add Product</button>

        <div id="purTotalDisplay" style="text-align:right; font-size:1.1rem; font-weight:700;
          margin-bottom:16px; color:var(--ink);">Total: ₹0</div>

        <!-- Bill Upload -->
        <div class="field">
          <label>Bill Photo <span style="color:var(--warn); font-size:0.8rem;">* Required</span></label>
          <div id="billUploadArea" style="border:2px dashed var(--line); border-radius:12px;
            padding:20px; text-align:center; cursor:pointer;" onclick="document.getElementById('purBillInput').click()">
            <div id="billPreviewThumb" style="display:none; margin-bottom:10px;">
              <img id="billThumbImg" style="max-height:120px; border-radius:8px; max-width:100%;" src="" alt="Bill">
            </div>
            <div id="billUploadPrompt">
              <div style="font-size:1.6rem; margin-bottom:4px;">📷</div>
              <div style="font-size:0.9rem; color:var(--ink-soft);">Tap to take photo or upload bill</div>
            </div>
          </div>
          <input id="purBillInput" type="file" accept="image/*" capture="environment"
            style="display:none;" onchange="handleBillUpload(this)">
          <div id="billStatusText" style="font-size:0.8rem; margin-top:6px; color:var(--ink-soft);"></div>
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="recordPurchase()">
          Save Purchase &amp; Update Stock
        </button>
      </div>

      <h3 class="mt-16 mb-8">Recent Purchases</h3>
      <div class="card" style="padding:0;"><div id="purchaseList"></div></div>
    </div>

    <!-- ========== SERVICES TAB ========== -->
    <div id="tab-services" style="display:none;">
      <div class="flex mb-16" style="justify-content:space-between;">
        <h3>Services</h3>
        <button class="btn btn-primary" onclick="openServiceModal()">+ New Service</button>
      </div>
      <div class="card" style="padding:0;"><div id="serviceList"></div></div>
    </div>

  </main>
</div>

<!-- ========== PRODUCT MODAL ========== -->
<dialog id="productModal" style="border:none; border-radius:20px; padding:0; width:min(440px,94vw);">
  <div class="card" style="border:none; box-shadow:none;">
    <h2 class="mb-16">New Product</h2>
    <input type="hidden" id="prodId">

    <div class="field">
      <label>Product Name *</label>
      <input id="prodName" type="text" placeholder="e.g. Shampoo Loreal 1000ml">
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label>Pack Size *</label>
        <input id="prodPackWeight" type="number" min="1" placeholder="e.g. 1000">
      </div>
      <div class="field">
        <label>Unit *</label>
        <select id="prodPackUnit">
          <option value="ml">ml</option>
          <option value="Liter">liter</option>
          <option value="grams">grams</option>
          <option value="kg">kg</option>
          <option value="pc">pc</option>
          <option value="pcs">pcs</option>
          <option value="box">box</option>
          <option value="set">set</option>
          <option value="sachet">sachet</option>
          <option value="strip">strip</option>
        </select>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label>Selling Price (₹)</label>
        <input id="prodSellPrice" type="number" min="0" placeholder="₹">
      </div>
      <div class="field">
        <label>Low Stock Alert</label>
        <input id="prodLowStock" type="number" min="0" placeholder="in base unit">
      </div>
    </div>
    <p class="text-soft" style="font-size:0.78rem; margin-top:-8px; margin-bottom:16px;">
      Low stock alert in base units — e.g. 500 for 500ml
    </p>

    <div class="flex gap-12" style="justify-content:space-between;">
      <button id="prodDeleteBtn" class="btn btn-ghost" style="color:var(--danger);"
        onclick="deleteProduct(document.getElementById('prodId').value)">Delete</button>
      <div class="flex gap-8">
        <button class="btn btn-ghost" onclick="document.getElementById('productModal').close()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>
</dialog>

<!-- Bill Missing Dialog -->
<dialog id="billMissingDialog" style="border:none; border-radius:20px; padding:0; width:min(360px,92vw);">
  <div class="card" style="border:none; box-shadow:none;">
    <h3 class="mb-16">Bill Photo Required</h3>
    <p style="color:var(--ink-soft); font-size:0.9rem; margin-bottom:20px;">
      Please upload a photo of the purchase bill. If unavailable, you can proceed without it.
    </p>
    <div class="flex gap-12" style="flex-direction:column;">
      <button class="btn btn-primary" onclick="document.getElementById('billMissingDialog').close(); document.getElementById('purBillInput').click();">
        📷 Click Photo of Bill
      </button>
      <button class="btn btn-ghost" onclick="proceedWithoutBill()" style="color:var(--warn);">
        Bill Not Available — Continue Anyway
      </button>
    </div>
  </div>
</dialog>

<!-- Service Modal -->
<dialog id="serviceModal" style="border:none; border-radius:20px; padding:0; width:min(560px,92vw);">
  <form method="dialog" id="serviceForm" class="card" style="border:none; box-shadow:none;">
    <h2 class="mb-16">New Service</h2>
    <input type="hidden" id="svcId">
    <div class="grid grid-2">
      <div class="field"><label>Service Name *</label><input id="svcName" required></div>
      <div class="field"><label>Price (₹) *</label><input id="svcPrice" type="number" min="0" required></div>
    </div>
    <div class="field"><label>Duration (minutes)</label><input id="svcDuration" type="number" min="0"></div>
    <label style="font-weight:600; margin-bottom:8px; display:block;">Product Consumption (per service)</label>
    <div id="svcConsumptionRows"></div>
    <button type="button" class="btn btn-secondary mb-16" onclick="addConsumptionRow()">+ Add Product Used</button>
    <div class="flex gap-12" style="justify-content:flex-end;">
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('serviceModal').close()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save Service</button>
    </div>
  </form>
</dialog>

<script src="assets/js/db.js"></script>
<script src="assets/js/session.js"></script>
<script>requireLogin(); enforceAccess('inventory'); applyRoleUI();</script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/app-config.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/reminders.js"></script>
<script src="assets/js/inventory.js"></script>
</body>
</html>
